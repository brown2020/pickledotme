name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "REDACTED_BY_HISTORY_PURGE"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "pickledotme.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "pickledotme"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "pickledotme.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "66067191944"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:66067191944:web:d98516abcf60efd260673d"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
